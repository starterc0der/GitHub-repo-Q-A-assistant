services:
  qdrant:
    image: qdrant/qdrant:latest
    environment:
      # Default INFO logs every vector query, drowning the app's own logs.
      QDRANT__LOG_LEVEL: WARN
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Container-network address — overrides whatever .env has for Qdrant.
      QDRANT_URL: http://qdrant:6333
      REPO_CLONE_DIR: /app/data/repos
      UPLOAD_DIR: /app/data/uploads
      DB_PATH: /app/data/db/app.db
      # Interpolated from .env (compose reads it automatically) or the shell.
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env — see Configuration in the README}
      LLM_MODEL: ${LLM_MODEL:-gemini-flash-latest}
      LLM_BULK_MODEL: ${LLM_BULK_MODEL:-gemini-flash-lite-latest}
      PRELOAD_MODELS: ${PRELOAD_MODELS:-true}
      CONNECTOR_ENCRYPTION_KEY: ${CONNECTOR_ENCRYPTION_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — see Configuration in the README}
    volumes:
      # Named volumes, not host bind-mounts: cloned repos, uploaded files, the sqlite
      # db, and downloaded models are scratch/state owned by the container's root user.
      - repo_data:/app/data/repos
      - uploads:/app/data/uploads
      - app_db:/app/data/db
      - hf_cache:/root/.cache/huggingface # avoids re-downloading embedding/reranker models
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      # No curl/wget in the slim image — Python's stdlib is always there. /health only
      # answers once uvicorn is actually accepting connections, which FastAPI's lifespan
      # protocol delays until model preload finishes (see PRELOAD_MODELS in main.py) —
      # so this healthcheck failing IS the container still starting up, not broken.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 40

  frontend:
    build: ./frontend
    ports:
      - "5183:5183"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  hf_cache:
  repo_data:
  uploads:
  app_db:
  qdrant_storage:
