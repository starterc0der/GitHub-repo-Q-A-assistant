[project]
name = "github-repo-qa"
version = "0.1.0"
description = "GitHub Repo Q&A Assistant — layered retrieval over codebases"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.2",
    "requests>=2.32",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack==0.13.0",
    "rank-bm25>=0.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# data/repos holds cloned repos (gitignored scratch) — including, after ingesting this
# project itself, a stale copy of this very test suite. Never collect from there.
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
